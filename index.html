<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>SETLOG — Workout Tracker</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="SETLOG" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FFFFFF; --panel:#FFFFFF; --field:#FFFFFF; --line:#000000; --line-strong:#000000; --line-soft:#000000;
    --ink:#000000; --ink-soft:#666666; --ink-dim:#8A796E; --dim2:#CCCCCC;
    --citron:#D4E600; --citron-ink:#000000;
    --head:#FFFFFF; --cta:#000000;
    --green:#4C7A5D; --green-soft:#E4EFE8; --green-ink:#37624A;
    --amber:#C97A3D; --amber-soft:#F5E6D8; --amber-ink:#5C4634;
    --red:#B4533F; --red-soft:#F5E1DC;
    --head-ink:#000000; --head-dim:#666666; --head-chrome:#000000;
  }
  html[data-theme="dark"]{
    --bg:#0A0A09; --panel:#141412; --field:#141412; --line:#FFFDFB; --line-strong:#FFFDFB; --line-soft:#FFFDFB;
    --ink:#FFFDFB; --ink-soft:#A8A79E; --ink-dim:#8A796E; --dim2:#3A3A35;
    --citron:#D4E600; --citron-ink:#000000;
    --head:#0A0A09; --cta:#D4E600;
    --green:#7DB894; --green-soft:#1C2E22; --green-ink:#A9D3B7;
    --amber:#D89A63; --amber-soft:#3A2E22; --amber-ink:#E4C9A9;
    --red:#C46854; --red-soft:#3B2420;
    --head-ink:#FFFDFB; --head-dim:#A8A79E; --head-chrome:#FFFDFB;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  body{ padding-bottom:calc(112px + env(safe-area-inset-bottom)); }
  .num{ font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .mono{ font-variant-numeric:tabular-nums; text-transform:uppercase; letter-spacing:.09em; font-weight:700; }
  .display{ font-family:'Unbounded',sans-serif; }
  a{ color:var(--ink); text-decoration:underline; } a:hover{ color:var(--ink-soft); }
  button{ font-family:inherit; cursor:pointer; }

  header.top{ background:var(--head); padding:calc(14px + env(safe-area-inset-top)) 16px 0; position:sticky; top:0; z-index:20;
    border-bottom:3px solid var(--line); }
  .brandrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:14px; max-width:640px; margin:0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .mark{ width:34px; height:34px; border-radius:0; background:var(--ink); color:var(--bg); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; font-family:'Unbounded',sans-serif; border:2px solid var(--line); }
  .brand h1{ margin:0; font-size:22px; font-weight:800; letter-spacing:.01em; color:var(--head-ink); line-height:1; font-family:'Unbounded',sans-serif; }
  .tagline{ margin:3px 0 0; font-size:9px; color:var(--head-dim); }
  .headbtns{ display:flex; align-items:center; gap:8px; }
  .iconbtn{ width:40px; height:40px; border:2px solid var(--line); background:var(--bg); border-radius:0; display:flex; align-items:center; justify-content:center; }
  .iconbtn.settings{ background:var(--citron); }
  .tabs{ display:flex; gap:2px; max-width:640px; margin:0 auto; }
  .tabs button{ flex:1; border:none; background:none; padding:11px 0 12px; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.08em; color:var(--head-dim); border-top:3px solid transparent; }
  .tabs button[aria-selected="true"]{ color:var(--head-ink); background:var(--citron); border-top-color:var(--line); }

  main{ max-width:640px; margin:0 auto; padding:18px 16px 0; }
  .card{ background:var(--panel); border:2.5px solid var(--line-strong); border-radius:0; box-shadow:4px 4px 0 var(--line); }
  .soft{ background:var(--panel); border:2px solid var(--line); border-radius:0; }
  .eyebrow{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-family:'Inter',sans-serif; }
  .hero{ padding:22px 18px 18px; margin-bottom:16px; }
  .hero h2{ font-size:28px; font-weight:800; letter-spacing:-.01em; line-height:1.05; margin:8px 0 4px; font-family:'Unbounded',sans-serif; }
  .hero p{ margin:0 0 18px; font-size:13.5px; color:var(--ink-soft); }
  .primary{ width:100%; height:56px; border:2.5px solid var(--line); border-radius:0; background:var(--cta); color:var(--bg); font-size:15px; font-weight:800; font-family:'Unbounded',sans-serif; letter-spacing:.02em; }
  html[data-theme="dark"] .primary{ color:var(--citron-ink); }
  .tmpl{ width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 15px; margin-bottom:10px; background:var(--panel); border:2px solid var(--line); border-radius:0; color:var(--ink); }
  .tmpl b{ display:block; font-size:15px; font-weight:700; font-family:'Unbounded',sans-serif; }
  .tmpl small{ display:block; font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .tmpl .tag{ font-size:12px; font-weight:800; padding:5px 9px; background:var(--citron); color:var(--citron-ink); border:1.5px solid var(--line); }
  .routine-search-wrap{ margin-bottom:14px; }

  .sessionbar{ background:var(--ink); border:3px solid var(--line); border-radius:0; padding:16px 18px; margin-bottom:16px; }
  html[data-theme="dark"] .sessionbar{ background:var(--panel); }
  .sessionbar-top{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:14px; }
  .sessionbar .big{ font-size:28px; font-weight:800; color:var(--bg); line-height:1.05; font-family:'Unbounded',sans-serif; }
  html[data-theme="dark"] .sessionbar .big{ color:var(--ink); }
  .sessionbar .k{ font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:#B6C5CB; margin-top:3px; }
  .sessionbar .stats{ display:flex; gap:20px; text-align:right; }
  .sessionbar .stats b{ font-size:19px; font-weight:800; color:var(--bg); display:block; line-height:1; font-family:'Unbounded',sans-serif; }
  html[data-theme="dark"] .sessionbar .stats b{ color:var(--ink); }
  .sessionbar-actions{ display:flex; gap:8px; align-items:center; }
  .sb-finish{ height:38px; padding:0 16px; border:2px solid var(--line); background:var(--citron); color:var(--citron-ink); font-size:11.5px; font-weight:800; font-family:'Unbounded',sans-serif; letter-spacing:.03em; }
  .sb-discard{ height:38px; padding:0 12px; border:1.5px solid #4E5A5F; background:none; color:#B6C5CB; font-size:11px; font-weight:600; }

  .ex{ margin-bottom:14px; overflow:hidden; box-shadow:3px 3px 0 var(--line); }
  .ex-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px 12px; border-bottom:2px solid var(--line); }
  .ex-head b{ font-size:15.5px; font-weight:800; font-family:'Unbounded',sans-serif; }
  .ex-head .target{ display:block; font-size:10.5px; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; letter-spacing:.04em; }
  .ex-head small{ display:block; font-size:10.5px; color:var(--ink-soft); margin-top:3px; }
  .ex-body{ padding:10px 12px 12px; }
  .setrow, .setlabels{ display:grid; grid-template-columns:20px 1fr 1fr 44px 46px; gap:6px; align-items:center; }
  .setlabels{ font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:0 2px 6px; font-weight:700; }
  .setlabels span{ text-align:center; }
  .setrow{ margin-bottom:8px; }
  .setrow .n{ font-size:13px; font-weight:700; text-align:center; color:var(--ink-dim); }
  .stepper{ display:flex; align-items:center; height:50px; border:2px solid var(--line); border-radius:0; background:var(--field); overflow:hidden; }
  .stepper button{ width:26px; height:100%; border:none; background:none; font-size:16px; color:var(--ink-soft); }
  .stepper input{ flex:1; min-width:0; border:none; background:none; text-align:center; font-family:inherit;
    font-size:16px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; outline:none; }
  .rpe-stepper{ display:flex; flex-direction:column; align-items:center; height:50px; border:2px solid var(--line); background:var(--field); justify-content:center; }
  .rpe-stepper input{ width:100%; border:none; background:none; text-align:center; font-family:inherit; font-size:15px; font-weight:700; color:var(--ink); outline:none; padding:0; }
  .rpe-stepper .rpebtns{ display:flex; width:100%; }
  .rpe-stepper .rpebtns button{ flex:1; border:none; background:none; font-size:12px; color:var(--ink-soft); height:16px; line-height:16px; }
  .check{ height:50px; border-radius:0; background:var(--panel); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .done .stepper, .done .rpe-stepper{ border-color:var(--line); background:var(--citron); }
  .done .stepper input, .done .rpe-stepper input{ color:var(--citron-ink); }
  .done .n{ color:var(--ink); }
  .done .check{ background:var(--ink); border-color:var(--line); }
  html[data-theme="dark"] .done .check{ background:var(--citron); }
  .addset{ width:100%; height:44px; margin-top:2px; border:2px dashed var(--dim2); border-radius:0;
    background:none; color:var(--ink-soft); font-size:13px; font-weight:500; }
  .addex{ width:100%; height:52px; margin-top:14px; border:2px solid var(--line-strong); border-radius:0;
    background:var(--citron); color:var(--citron-ink); font-size:13.5px; font-weight:800; font-family:'Unbounded',sans-serif; letter-spacing:.02em; }
  textarea{ width:100%; min-height:64px; border:2px solid var(--line); border-radius:0; background:var(--field);
    padding:12px 13px; font-family:inherit; font-size:13.5px; color:var(--ink); resize:vertical; outline:none; }
  textarea:focus{ border-color:var(--ink); }
  .finishrow{ display:flex; gap:10px; margin-top:16px; }
  .finish{ flex:1; height:54px; border:2px solid var(--line); border-radius:0; background:var(--citron); color:var(--citron-ink); font-size:14.5px; font-weight:800; font-family:'Unbounded',sans-serif; }
  .discard{ width:96px; height:54px; border-radius:0; border:2px solid var(--line); background:var(--panel); color:var(--ink-soft); font-size:13.5px; }

  .hcard{ width:100%; text-align:left; padding:14px 15px; margin-bottom:11px; background:var(--panel);
    border:2px solid var(--line); border-radius:0; color:var(--ink); }
  .hcard .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .hcard b{ font-size:15px; font-weight:800; font-family:'Unbounded',sans-serif; text-transform:uppercase; letter-spacing:.01em; }
  .hcard .subdate{ display:block; font-size:10.5px; color:var(--ink-soft); margin-top:3px; }
  .hcard small{ display:block; font-size:10.5px; color:var(--ink-soft); margin-top:6px; }
  .pill{ font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:5px 8px; border-radius:0;
    flex-shrink:0; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
  .chip{ font-size:11px; color:var(--ink); font-weight:600; background:var(--bg); border:1.5px solid var(--line); border-radius:0; padding:4px 8px; }
  .kpis{ display:flex; gap:10px; margin-bottom:16px; }
  .kpi{ flex:1; padding:13px 14px; }
  .kpi b{ display:block; font-size:24px; font-weight:800; line-height:1; font-family:'Unbounded',sans-serif; }
  .kpi small{ display:block; font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-top:4px; font-weight:700; }

  .volhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .volhead b{ display:block; font-size:22px; font-weight:800; font-family:'Unbounded',sans-serif; }
  .voltrend{ font-size:11px; font-weight:800; padding:6px 10px; border:1.5px solid var(--line); background:var(--citron); color:var(--citron-ink); }
  .voltrend.down{ background:var(--bg); color:var(--ink); }

  .bars{ display:flex; align-items:flex-end; gap:7px; height:132px; }
  .bars div{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; height:100%; font-size:8.5px; color:var(--ink-soft); font-weight:700; }
  .bars i{ display:block; width:100%; background:var(--ink); border-radius:0; }
  html[data-theme="dark"] .bars i{ background:var(--ink-soft); }
  .bars i.peak{ background:var(--citron); }
  .prrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; margin-bottom:9px; }
  .prrow b{ font-size:14px; font-weight:800; font-family:'Unbounded',sans-serif; text-transform:uppercase; }
  .prrow small{ display:block; font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .prrow .v{ font-size:19px; font-weight:800; font-family:'Unbounded',sans-serif; text-align:right; }
  .prtrend{ display:block; font-size:9.5px; font-weight:800; margin-top:3px; text-align:right; }
  .prtrend.up{ color:var(--ink); } .prtrend.same{ color:var(--ink-soft); } .prtrend.new{ color:var(--ink); }
  html[data-theme="dark"] .prtrend.up{ color:var(--citron); }

  .search{ display:flex; align-items:center; gap:9px; height:48px; padding:0 13px; margin-bottom:16px;
    border:2px solid var(--line-strong); border-radius:0; background:var(--panel); }
  .search input{ flex:1; border:none; background:none; font-family:inherit; font-size:14px; color:var(--ink); outline:none; }
  .catrow{ display:flex; align-items:center; gap:9px; margin:0 0 9px; }
  .catrow hr{ flex:1; border:none; border-top:1px solid var(--line); margin:0; }
  .catrow em{ font-size:10px; font-style:normal; color:var(--ink-dim); font-weight:700; }
  .libitem{ width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 14px; background:var(--panel); border:1.5px solid var(--line); color:var(--ink); font-size:14px; font-weight:600; }
  .libitem > span:first-child{ display:flex; flex-direction:column; gap:2px; }
  .libitem .target{ display:block; font-size:10.5px; color:var(--ink-soft); font-weight:400; text-transform:uppercase; letter-spacing:.03em; }

  .timerbar{ position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); height:60px; z-index:40;
    max-width:612px; margin:0 auto; border-radius:0; background:var(--ink); box-shadow:4px 4px 0 var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 8px 0 16px; border:2px solid var(--line); }
  html[data-theme="dark"] .timerbar{ background:var(--panel); }
  .timerbar .ring{ width:34px; height:34px; border-radius:0; border:2px solid var(--bg); display:flex; align-items:center; justify-content:center; color:var(--bg); }
  html[data-theme="dark"] .timerbar .ring{ border-color:var(--ink); color:var(--ink); }
  .timerbar .lbl{ display:block; font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:#B6C5CB; text-align:left; }
  .timerbar .t{ display:block; font-size:20px; font-weight:800; color:var(--bg); line-height:1.15; font-variant-numeric:tabular-nums; font-family:'Unbounded',sans-serif; }
  html[data-theme="dark"] .timerbar .t{ color:var(--ink); }
  .timerbar .go{ height:44px; padding:0 18px; border:1.5px solid var(--bg); border-radius:0; background:var(--citron); color:var(--citron-ink); font-size:13px; font-weight:800; }
  .timerbar.running .go{ background:var(--bg); color:var(--ink); }
  .timerbar.running .ring{ border-color:var(--citron); color:var(--citron); } .timerbar.rang .ring{ border-color:var(--citron); }

  .scrim{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--bg); border-top:3px solid var(--line-strong);
    border-radius:0; padding:14px 20px calc(28px + env(safe-area-inset-bottom)); animation:up .22s ease-out; }
  .sheet.tall{ top:64px; display:flex; flex-direction:column; padding-bottom:0; }
  @keyframes up{ from{ transform:translateY(100%) } to{ transform:translateY(0) } }
  .grab{ width:44px; height:4px; border-radius:0; background:var(--dim2); margin:0 auto 14px; }
  .sheethead{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .sheethead button{ border:none; background:none; font-size:11px; color:var(--ink-soft); padding:6px; font-weight:700; }
  .gauge{ position:relative; width:236px; max-width:70vw; aspect-ratio:1; margin:2px auto 14px; }
  .gauge svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .gauge .read{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gauge .read b{ font-size:48px; font-weight:800; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; font-family:'Unbounded',sans-serif; }
  .gauge .read span{ font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-top:8px; font-weight:700; }
  .gauge .read em{ font-style:normal; font-size:10.5px; color:var(--ink-dim); margin-top:4px; }
  .presets{ display:flex; gap:6px; margin-bottom:12px; }
  .presets button{ flex:1; height:46px; border:1.5px solid var(--line); border-radius:0; background:var(--panel); color:var(--ink); font-size:13px; font-weight:700; }
  .presets button[aria-pressed="true"]{ background:var(--citron); color:var(--citron-ink); }
  .tcontrols{ display:flex; gap:8px; }
  .tcontrols button{ height:54px; border-radius:0; font-size:14px; font-weight:700; }
  .tcontrols .go{ flex:2; border:2px solid var(--line); background:var(--cta); color:var(--bg); font-size:15px; font-family:'Unbounded',sans-serif; }
  html[data-theme="dark"] .tcontrols .go{ color:var(--citron-ink); }
  .tcontrols .alt{ flex:1; border:2px solid var(--line); background:var(--panel); color:var(--ink); }
  .tcontrols .rst{ flex:1; border:2px solid var(--line); background:var(--panel); color:var(--ink-soft); }

  .screen{ position:fixed; inset:0; z-index:70; background:var(--bg); display:flex; flex-direction:column; }
  .screen .hd{ background:var(--head); padding:calc(14px + env(safe-area-inset-top)) 16px 16px; border-bottom:3px solid var(--line); }
  .screen .hd .inner{ max-width:640px; margin:0 auto; }
  .screen .hd h2{ margin:6px 0 0; font-size:22px; font-weight:800; color:var(--head-ink); line-height:1.1; font-family:'Unbounded',sans-serif; text-transform:uppercase; }
  .titlerow{ display:flex; align-items:center; gap:8px; }
  .renamebtn{ border:1.5px solid var(--line); background:var(--panel); color:var(--ink-soft); font-size:10px; font-weight:700; padding:4px 8px; text-transform:uppercase; letter-spacing:.04em; }
  .back{ display:inline-flex; align-items:center; gap:7px; border:none; background:none; padding:6px 0;
    color:var(--head-chrome); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .screen .body{ flex:1; overflow-y:auto; padding:16px 16px calc(40px + env(safe-area-inset-bottom)); }
  .screen .body .inner{ max-width:640px; margin:0 auto; }
  .dstats{ display:flex; gap:22px; margin-top:14px; }
  .dstats b{ display:block; font-size:18px; font-weight:800; color:var(--head-ink); line-height:1; font-family:'Unbounded',sans-serif; }
  .dstats small{ display:block; font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--head-dim); margin-top:3px; font-weight:700; }
  .dset{ display:grid; grid-template-columns:22px 1fr 1fr 1fr 56px; align-items:center; padding:9px 14px; border-top:1.5px solid var(--line-soft); font-size:12.5px; }
  .dset .i{ color:var(--ink-dim); font-size:11.5px; }
  .dset b{ font-weight:700; }
  .dset .top{ text-align:right; font-size:10px; color:var(--ink); font-weight:800; background:var(--citron); padding:2px 5px; }
  .notes{ margin-top:14px; border:2px solid var(--line); background:var(--panel); border-radius:0;
    padding:12px 14px; font-size:13.5px; color:var(--ink); line-height:1.5; }
  .seg{ display:flex; border:2px solid var(--line-strong); border-radius:0; overflow:hidden; background:var(--panel); }
  .seg button{ flex:1; height:50px; border:none; background:var(--panel); color:var(--ink-soft); font-size:13px; font-weight:800; letter-spacing:.06em; }
  .seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
  html[data-theme="dark"] .seg button[aria-pressed="true"]{ background:var(--citron); color:var(--citron-ink); }
  .restopts{ display:flex; gap:6px; }
  .restopts button{ flex:1; height:48px; border:2px solid var(--line); border-radius:0; background:var(--panel); color:var(--ink-soft); font-size:12.5px; font-weight:700; }
  .restopts button[aria-pressed="true"]{ background:var(--ink); border-color:var(--line); color:var(--bg); }
  html[data-theme="dark"] .restopts button[aria-pressed="true"]{ background:var(--citron); color:var(--citron-ink); }
  .togglerow{ display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; padding:14px;
    border:none; border-top:1.5px solid var(--line-soft); background:var(--panel); text-align:left; color:var(--ink); }
  .togglerow:first-child{ border-top:none; }
  .togglerow b{ display:block; font-size:14px; font-weight:700; }
  .togglerow small{ display:block; font-size:11.5px; color:var(--ink-dim); margin-top:2px; }
  .track{ width:50px; height:30px; border-radius:0; background:var(--dim2); padding:3px; flex-shrink:0; display:flex; transition:background .15s; border:1.5px solid var(--line); }
  .track i{ width:22px; height:22px; border-radius:0; background:var(--bg); box-shadow:none; transition:transform .15s; border:1.5px solid var(--line); }
  .togglerow[aria-pressed="true"] .track{ background:var(--citron); }
  .togglerow[aria-pressed="true"] .track i{ transform:translateX(20px); }
  .datarow{ display:flex; gap:8px; margin-top:12px; }
  .datarow button{ flex:1; height:46px; border-radius:0; background:var(--panel); font-size:13.5px; font-weight:700; }
  .datarow .exp{ border:2px solid var(--line); color:var(--ink); }
  .datarow .clr{ border:2px solid var(--line); color:var(--red); }
  .sect{ margin-bottom:20px; }
  .empty{ padding:22px 14px; text-align:center; font-size:13px; color:var(--ink-soft); border:2px dashed var(--dim2); border-radius:0; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<header class="top">
  <div class="brandrow">
    <div class="brand">
      <div class="mark">SL</div>
      <div>
        <h1>SETLOG</h1>
        <p class="tagline mono" id="tagline">date · exercise · load · reps</p>
      </div>
    </div>
    <div class="headbtns">
      <button class="iconbtn" id="themeBtn" aria-label="Toggle theme"></button>
      <button class="iconbtn settings" id="settingsBtn" aria-label="Settings">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M4.2 7l2.6 1.5M17.2 15.5l2.6 1.5M4.2 17l2.6-1.5M17.2 8.5l2.6-1.5"/></svg>
      </button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="history" aria-selected="false">History</button>
    <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
    <button role="tab" data-tab="library" aria-selected="false">Library</button>
  </nav>
</header>

<main>
  <section id="view-today"></section>
  <section id="view-history" class="hidden"></section>
  <section id="view-progress" class="hidden"></section>
  <section id="view-library" class="hidden"></section>
</main>

<button class="timerbar" id="timerBar">
  <span style="display:flex;align-items:center;gap:12px">
    <span class="ring"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="color:inherit"><path d="M12 7v5.5l3.5 2.5"/></svg></span>
    <span>
      <span class="lbl" id="barLabel">Rest timer</span>
      <span class="t" id="barTime">01:30</span>
    </span>
  </span>
  <span style="display:flex;align-items:center;gap:6px">
    <span class="go" id="barGo" style="display:flex;align-items:center">Start</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7E939C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
  </span>
</button>

<div id="overlays"></div>

<script>
(function(){
  "use strict";

  var PRESETS = {
    Push: ["Bench Press","Overhead Press","Incline Dumbbell Press","Dips","Triceps Pushdown"],
    Pull: ["Deadlift","Barbell Row","Pull-up","Lat Pulldown","Barbell Curl"],
    Legs: ["Back Squat","Front Squat","Romanian Deadlift","Leg Press","Calf Raise"],
    Core: ["Hanging Leg Raise","Plank (timed)","Cable Crunch"]
  };
  var TARGETS = {
    "Bench Press":"Chest, Triceps", "Overhead Press":"Shoulders, Triceps", "Incline Dumbbell Press":"Upper Chest",
    "Dips":"Chest, Triceps", "Triceps Pushdown":"Triceps",
    "Deadlift":"Back, Hamstrings", "Barbell Row":"Lats, Upper Back", "Pull-up":"Lats, Biceps",
    "Lat Pulldown":"Lats", "Barbell Curl":"Biceps",
    "Back Squat":"Quads, Glutes", "Front Squat":"Quads, Core", "Romanian Deadlift":"Hamstrings, Glutes",
    "Leg Press":"Quads, Glutes", "Calf Raise":"Calves",
    "Hanging Leg Raise":"Lower Abs", "Plank (timed)":"Core", "Cable Crunch":"Abs"
  };
  function targetFor(name){ return TARGETS[name] || "General"; }
  var SESSION_NAMES = { Push:"Push Day", Pull:"Pull Day", Legs:"Leg Day", Core:"Core Day", Custom:"Workout" };
  function titleFor(tag){ return SESSION_NAMES[tag] || "Workout"; }
  var TEMPLATES = [
    { name:"Push A", tag:"PSH", items:["Bench Press","Overhead Press","Incline Dumbbell Press","Dips"] },
    { name:"Pull A", tag:"PLL", items:["Deadlift","Barbell Row","Pull-up","Barbell Curl"] },
    { name:"Legs",   tag:"LEG", items:["Back Squat","Romanian Deadlift","Leg Press","Calf Raise"] }
  ];
  var REST_OPTS = [30,60,90,120,180];
  var DEFAULT_SETTINGS = { unit:"lb", defaultRest:90, darkMode:false, autoTimer:true, sound:true };

  var workouts = [], customExercises = [], settings = Object.assign({}, DEFAULT_SETTINGS);
  var active = null;                     // { startedAt, exercises:[{id,name,sets:[{weight,reps,rpe,done}]}], notes }
  var tab = "today", detailId = null, overlay = null, librarySearch = "", routineSearch = "";
  var timer = { duration:90, remaining:90, running:false, ctx:null, label:null };
  var GC = 2 * Math.PI * 104;

  function el(id){ return document.getElementById(id); }
  function esc(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function read(key, fb){ try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
  function write(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
  function todayStr(){ var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
  function fmtDate(str){ var p = str.split("-").map(Number); return new Date(p[0], p[1]-1, p[2])
      .toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" }); }
  function mmss(t){ return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0"); }
  function volFmt(n){ return n >= 1000 ? (n/1000).toFixed(1) + "k" : String(Math.round(n)); }
  function allKnown(){ var out=[]; Object.keys(PRESETS).forEach(function(k){ out = out.concat(PRESETS[k]); }); return out.concat(customExercises); }
  function catOf(name){ var found = "Custom"; Object.keys(PRESETS).forEach(function(k){ if(PRESETS[k].indexOf(name) > -1) found = k; }); return found; }
  function sessionTag(exs){ var c = {}; exs.forEach(function(e){ var k = catOf(e.name); c[k] = (c[k]||0)+1; });
    return Object.keys(c).sort(function(a,b){ return c[b]-c[a]; })[0] || "Custom"; }

  function load(){
    workouts = read("setlog_workouts", []) || [];
    customExercises = read("setlog_customExercises", []) || [];
    settings = Object.assign({}, DEFAULT_SETTINGS, read("setlog_settings", {}) || {});
    active = read("setlog_activeSession", null);
    workouts.sort(function(a,b){ return b.date.localeCompare(a.date); });
    timer.duration = timer.remaining = settings.defaultRest;
    applyTheme();
  }
  function saveWorkouts(){ write("setlog_workouts", workouts); }
  function saveSettings(){ write("setlog_settings", settings); }
  function saveActive(){ if(active) write("setlog_activeSession", active); else localStorage.removeItem("setlog_activeSession"); }
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", settings.darkMode ? "dark" : "light");
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", settings.darkMode ? "#0A0A09" : "#FFFFFF");
    var tb = el("themeBtn");
    if(tb) tb.innerHTML = settings.darkMode
      ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>'
      : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>';
  }

  // ---------- seeds ----------
  function lastSetsFor(name){
    for(var i=0; i<workouts.length; i++){
      var hit = workouts[i].exercises.filter(function(e){ return e.name === name; })[0];
      if(hit) return hit.sets.map(function(s){ return { weight:s.weight, reps:s.reps, rpe:0, done:false }; });
    }
    return [{weight:0,reps:8,rpe:0,done:false},{weight:0,reps:8,rpe:0,done:false},{weight:0,reps:8,rpe:0,done:false}];
  }
  function bestFor(name){
    var best = null;
    workouts.forEach(function(w){ w.exercises.forEach(function(e){ if(e.name !== name) return;
      e.sets.forEach(function(s){ if(!best || s.weight > best.weight) best = { weight:s.weight, reps:s.reps, date:w.date }; }); }); });
    return best;
  }
  function bestAsOf(name, cutoffStr){
    var best = null;
    workouts.forEach(function(w){ if(w.date >= cutoffStr) return; w.exercises.forEach(function(e){ if(e.name !== name) return;
      e.sets.forEach(function(s){ if(!best || s.weight > best.weight) best = { weight:s.weight, reps:s.reps, date:w.date }; }); }); });
    return best;
  }
  function prTrend(name){
    var now = new Date(), cutoff = new Date(now.getTime() - 30*86400000);
    var cutoffStr = new Date(cutoff.getTime() - cutoff.getTimezoneOffset()*60000).toISOString().slice(0,10);
    var current = bestFor(name), prior = bestAsOf(name, cutoffStr);
    if(!prior) return { status:"new", delta:0 };
    if(current.weight > prior.weight) return { status:"up", delta:current.weight - prior.weight };
    return { status:"same", delta:0 };
  }
  function startSession(names){
    active = { startedAt: Date.now(), notes:"", exercises: names.map(function(n){ return { id:genId(), name:n, sets:lastSetsFor(n) }; }) };
    saveActive(); tab = "today"; overlay = null; render();
  }
  function addExercise(name){
    name = (name||"").trim(); if(!name) return;
    if(allKnown().indexOf(name) === -1){ customExercises.push(name); write("setlog_customExercises", customExercises); }
    if(!active) return startSession([name]);
    active.exercises.push({ id:genId(), name:name, sets:lastSetsFor(name) });
    saveActive(); overlay = null; tab = "today"; render();
  }
  function finishSession(){
    if(!active) return;
    var clean = active.exercises.map(function(e){
      return { id:e.id, name:e.name, sets:e.sets.filter(function(s){ return s.done && s.reps > 0; })
        .map(function(s){ return { weight:Number(s.weight)||0, reps:Number(s.reps)||0, rpe:Number(s.rpe)||0 }; }) };
    }).filter(function(e){ return e.sets.length; });
    if(!clean.length){ alert("Check off at least one set before finishing."); return; }
    var mins = Math.max(1, Math.round((Date.now() - active.startedAt)/60000));
    workouts.push({ id:genId(), date:todayStr(), name:titleFor(sessionTag(clean)), exercises:clean, notes:active.notes||"", minutes:mins });
    workouts.sort(function(a,b){ return b.date.localeCompare(a.date); });
    saveWorkouts(); active = null; saveActive(); timer.running = false; tab = "history"; render();
  }

  // ---------- views ----------
  function tSets(exs){ return exs.reduce(function(a,e){ return a + e.sets.length; }, 0); }
  function tVol(exs){ return exs.reduce(function(a,e){ return a + e.sets.reduce(function(b,s){ return b + s.weight*s.reps; }, 0); }, 0); }

  function viewToday(){
    if(!active){
      var last = workouts[0];
      return '<div class="card hero">' +
        '<div class="eyebrow">Ready when you are</div>' +
        '<h2>' + (last ? "Next session" : "First session") + '</h2>' +
        '<p>' + (last ? "Last logged " + esc(fmtDate(last.date)) + " · " + esc(sessionTag(last.exercises)) + " · vol " + volFmt(tVol(last.exercises))
                      : "Nothing logged yet — start empty, or browse routines on the History tab.") + '</p>' +
        '<button class="primary" data-act="start-empty">+ &nbsp;Start empty workout</button></div>' +
        '<button class="tmpl" data-act="goto-routines" style="justify-content:center"><span><b>Browse routines</b>' +
        '<small>Saved templates now live on the History tab</small></span></button>';
    }
    var doneSets = active.exercises.reduce(function(a,e){ return a + e.sets.filter(function(s){ return s.done; }).length; }, 0);
    var vol = active.exercises.reduce(function(a,e){ return a + e.sets.filter(function(s){ return s.done; })
      .reduce(function(b,s){ return b + s.weight*s.reps; }, 0); }, 0);
    var elapsed = Math.floor((Date.now() - active.startedAt)/1000);

    var html = '<div class="sessionbar"><div class="sessionbar-top"><div><div class="k">Elapsed</div>' +
      '<div class="big num" id="elapsed">' + mmss(elapsed) + '</div></div>' +
      '<div class="sessionbar-actions"><button class="sb-discard" data-act="discard">Discard</button>' +
      '<button class="sb-finish" data-act="finish">Finish</button></div></div>' +
      '<div class="stats"><div><b class="num">' + doneSets + '</b><div class="k">Sets</div></div>' +
      '<div><b class="num">' + volFmt(vol) + '</b><div class="k">Volume</div></div></div></div>';

    html += active.exercises.map(function(e, ei){
      var dn = e.sets.filter(function(s){ return s.done; });
      var v = dn.reduce(function(a,s){ return a + s.weight*s.reps; }, 0);
      return '<div class="card ex"><div class="ex-head"><div><b>' + esc(e.name) + '</b>' +
        '<span class="target">Target: ' + esc(targetFor(e.name)) + '</span>' +
        '<small class="num">' + dn.length + "/" + e.sets.length + ' sets · vol ' + volFmt(v) + '</small></div>' +
        '<button class="iconbtn" data-act="rm-ex" data-e="' + ei + '" aria-label="Remove exercise">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="color:var(--ink-soft)"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
        '<div class="ex-body"><div class="setlabels"><span></span><span>' + (settings.unit === "lb" ? "Weight (lb)" : "Weight (kg)") + '</span><span>Reps</span><span>RPE</span><span></span></div>' +
        e.sets.map(function(s, si){
          return '<div class="setrow' + (s.done ? " done" : "") + '">' +
            '<div class="n num">' + (si+1) + '</div>' +
            '<div class="stepper"><button data-act="w-" data-e="' + ei + '" data-s="' + si + '">&minus;</button>' +
            '<input type="number" inputmode="decimal" step="any" min="0" value="' + s.weight + '" data-act="w=" data-e="' + ei + '" data-s="' + si + '" />' +
            '<button data-act="w+" data-e="' + ei + '" data-s="' + si + '">+</button></div>' +
            '<div class="stepper"><button data-act="r-" data-e="' + ei + '" data-s="' + si + '">&minus;</button>' +
            '<input type="number" inputmode="numeric" step="1" min="0" value="' + s.reps + '" data-act="r=" data-e="' + ei + '" data-s="' + si + '" />' +
            '<button data-act="r+" data-e="' + ei + '" data-s="' + si + '">+</button></div>' +
            '<div class="rpe-stepper"><input type="number" inputmode="numeric" step="1" min="0" max="10" placeholder="—" value="' + (s.rpe || "") + '" data-act="rpe=" data-e="' + ei + '" data-s="' + si + '" />' +
            '<div class="rpebtns"><button data-act="rpe-" data-e="' + ei + '" data-s="' + si + '">&minus;</button><button data-act="rpe+" data-e="' + ei + '" data-s="' + si + '">+</button></div></div>' +
            '<button class="check" data-act="chk" data-e="' + ei + '" data-s="' + si + '" aria-label="Log set">' +
            '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="' + (s.done ? "var(--citron-ink)" : "var(--dim2)") + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg></button></div>';
        }).join("") +
        '<button class="addset" data-act="add-set" data-e="' + ei + '">+ Add set</button></div></div>';
    }).join("");

    html += '<button class="addex" data-act="open-picker">+ Add exercise</button>' +
      '<div class="sect" style="margin-top:20px"><div class="eyebrow" style="margin-bottom:7px">Session notes</div>' +
      '<textarea id="notes" placeholder="Form cues, how it felt, what to change next time…">' + esc(active.notes) + '</textarea></div>';
    return html;
  }

  function viewHistory(){
    var weeks = {};
    workouts.forEach(function(w){ weeks[w.date.slice(0,7)] = 1; });
    var kpis = '<div class="kpis"><div class="card kpi"><b class="num">' + workouts.length + '</b>' +
      '<small>Sessions logged</small></div><div class="card kpi"><b class="num">' +
      volFmt(workouts.reduce(function(a,w){ return a + tVol(w.exercises); }, 0)) + '</b><small>Total volume</small></div></div>';

    var q = routineSearch.trim().toLowerCase();
    var matchedRoutines = !q ? TEMPLATES : TEMPLATES.filter(function(t){
      return t.name.toLowerCase().indexOf(q) > -1 || t.items.join(" ").toLowerCase().indexOf(q) > -1;
    });
    var routines = '<div class="sect"><div class="eyebrow" style="margin-bottom:9px">Routines</div>' +
      '<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>' +
      '<input id="routineSearch" placeholder="Search routines…" value="' + esc(routineSearch) + '" /></div>' +
      '<div id="routinesSection">' + routinesListHtml(matchedRoutines) + '</div></div>';

    if(!workouts.length) return routines + kpis + '<div class="empty">No sessions logged yet. Your first entry will show up here.</div>';
    return routines + kpis + workouts.map(function(w){
      var tag = sessionTag(w.exercises);
      return '<button class="hcard" data-act="open-detail" data-id="' + w.id + '"><span class="row">' +
        '<span><b>' + esc(w.name || titleFor(tag)) + '</b><span class="subdate num">' + esc(fmtDate(w.date)) + '</span>' +
        '<small class="num">' + w.exercises.length + ' exercises · ' + tSets(w.exercises) +
        ' sets · vol ' + volFmt(tVol(w.exercises)) + (w.minutes ? " · " + w.minutes + " min" : "") + '</small></span>' +
        '<span class="pill">' + esc(tag) + '</span></span>' +
        '<span class="chips">' + w.exercises.map(function(e){ return '<span class="chip">' + esc(e.name) + '</span>'; }).join("") + '</span></button>';
    }).join("");
  }
  function routinesListHtml(list){
    if(!list.length) return '<div class="empty">No routines match.</div>';
    return list.map(function(t,i){
      var idx = TEMPLATES.indexOf(t);
      return '<button class="tmpl" data-act="start-routine" data-i="' + idx + '"><span><b>' + esc(t.name) + '</b>' +
        '<small>' + esc(t.items.join(" · ")) + '</small></span>' +
        '<span class="tag num">' + t.tag + '</span></button>';
    }).join("");
  }

  function viewProgress(){
    var now = new Date();
    var cutoff30 = new Date(now.getTime() - 30*86400000);
    var cutoff60 = new Date(now.getTime() - 60*86400000);
    var c30 = new Date(cutoff30.getTime() - cutoff30.getTimezoneOffset()*60000).toISOString().slice(0,10);
    var c60 = new Date(cutoff60.getTime() - cutoff60.getTimezoneOffset()*60000).toISOString().slice(0,10);
    var totalVol = workouts.reduce(function(a,w){ return a + tVol(w.exercises); }, 0);
    var last30 = workouts.reduce(function(a,w){ return w.date >= c30 ? a + tVol(w.exercises) : a; }, 0);
    var prev30 = workouts.reduce(function(a,w){ return (w.date >= c60 && w.date < c30) ? a + tVol(w.exercises) : a; }, 0);
    var trendPct = prev30 > 0 ? Math.round((last30 - prev30) / prev30 * 100) : null;
    var volCard = '<div class="card" style="padding:16px 16px 14px;margin-bottom:12px">' +
      '<div class="eyebrow" style="margin-bottom:6px">Total volume</div>' +
      '<div class="volhead"><b class="num">' + volFmt(totalVol) + ' ' + settings.unit.toUpperCase() + '</b>' +
      (trendPct === null ? '' : '<span class="voltrend' + (trendPct < 0 ? ' down' : '') + '">' + (trendPct >= 0 ? '+' : '') + trendPct + '%</span>') +
      '</div><div class="eyebrow" style="font-weight:400;text-transform:none;letter-spacing:0">30 day overview</div></div>';

    var buckets = [];
    for(var i = 7; i >= 0; i--){
      var end = new Date(now.getTime() - i*7*86400000), start = new Date(end.getTime() - 6*86400000);
      var sum = workouts.reduce(function(a,w){
        var p = w.date.split("-").map(Number), d = new Date(p[0], p[1]-1, p[2]);
        return (d >= start && d <= end) ? a + tVol(w.exercises) : a;
      }, 0);
      buckets.push({ label:"W" + (8-i), value:sum });
    }
    var max = Math.max.apply(null, buckets.map(function(b){ return b.value; })) || 1;
    var bars = '<div class="card" style="padding:16px 16px 14px;margin-bottom:16px">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px">' +
      '<div class="eyebrow">Weekly volume</div><div class="num" style="font-size:10px;color:var(--ink-soft)">8 weeks</div></div>' +
      '<div class="bars">' + buckets.map(function(b){
        return '<div><span class="num">' + (b.value ? volFmt(b.value) : "") + '</span>' +
          '<i class="' + (b.value === max && b.value ? "peak" : "") + '" style="height:' + Math.round(b.value/max*96) + 'px"></i>' +
          '<span class="num">' + b.label + '</span></div>';
      }).join("") + '</div></div>';

    var names = {}; workouts.forEach(function(w){ w.exercises.forEach(function(e){ names[e.name] = 1; }); });
    var prs = Object.keys(names).map(function(n){ var b = bestFor(n); return { name:n, best:b, trend:prTrend(n) }; })
      .filter(function(p){ return p.best; }).sort(function(a,b){ return b.best.weight - a.best.weight; }).slice(0,8);
    var list = prs.length ? prs.map(function(p){
      var t = p.trend, label = t.status === "up" ? "+" + t.delta + " " + settings.unit.toUpperCase() + " THIS MONTH"
        : t.status === "new" ? "NEW" : "MAINTAINED";
      return '<div class="soft prrow"><div><b>' + esc(p.name) + '</b><small>' + esc(fmtDate(p.best.date)) + '</small></div>' +
        '<div><div class="v num">' + (p.best.weight || "BW") + ' <span style="font-size:11px;color:var(--ink-soft)">× ' + p.best.reps + '</span></div>' +
        '<span class="prtrend ' + t.status + '">' + label + '</span></div></div>';
    }).join("") : '<div class="empty">Log a few sessions and your records will appear here.</div>';
    return volCard + bars + '<div class="eyebrow" style="margin:0 0 10px 2px">Personal records</div>' + list;
  }

  function libraryGroups(){
    var groups = Object.keys(PRESETS).map(function(k){ return { name:k, items:PRESETS[k].slice() }; });
    if(customExercises.length) groups.push({ name:"Custom", items:customExercises.slice() });
    var q = librarySearch.trim().toLowerCase();
    if(q) groups = groups.map(function(g){
      return { name:g.name, items:g.items.filter(function(n){ return n.toLowerCase().indexOf(q) > -1; }) };
    }).filter(function(g){ return g.items.length; });
    return groups;
  }
  function libraryList(showBest){
    var groups = libraryGroups();
    if(!groups.length) return '<div class="empty">No match. Type a name and tap “Add as new”.</div>' +
      '<button class="addex" data-act="add-typed">+ Add “' + esc(librarySearch) + '” as new exercise</button>';
    return groups.map(function(g){
      return '<div class="sect"><div class="catrow"><span class="pill">' + esc(g.name) + '</span>' +
        '<hr /><em class="num">' + g.items.length + '</em></div>' +
        g.items.map(function(n){
          var b = showBest ? bestFor(n) : null;
          return '<button class="libitem" data-act="add-ex" data-name="' + esc(n) + '"><span>' + esc(n) + '<span class="target">' + esc(targetFor(n)) + '</span></span>' +
            '<span class="num" style="font-size:10.5px;color:var(--ink-soft);white-space:nowrap">' + (b ? "best " + (b.weight || "BW") + "×" + b.reps : "+") + '</span></button>';
        }).join("") + '</div>';
    }).join("");
  }
  function viewLibrary(){
    return '<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>' +
      '<input id="libSearch" placeholder="Search exercises" value="' + esc(librarySearch) + '" /></div>' + libraryList(true);
  }

  // ---------- overlays ----------
  function timerSheet(){
    var frac = timer.duration ? timer.remaining / timer.duration : 0;
    var stroke = timer.remaining === 0 ? "var(--amber)" : "var(--ink)";
    return '<div class="scrim" data-act="close-overlay"></div><div class="sheet"><div class="grab"></div>' +
      '<div class="sheethead"><div class="eyebrow">Rest timer</div><button data-act="close-overlay">Close</button></div>' +
      '<div class="gauge"><svg viewBox="0 0 236 236"><circle cx="118" cy="118" r="104" fill="none" stroke="var(--line)" stroke-width="14"/>' +
      '<circle id="gauge" cx="118" cy="118" r="104" fill="none" stroke="' + stroke + '" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + GC + '" stroke-dashoffset="' + (GC*(1-frac)) + '"/></svg>' +
      '<div class="read"><b id="sheetTime">' + mmss(timer.remaining) + '</b><span id="sheetStatus">' +
      (timer.remaining === 0 ? "Time — next set" : timer.running ? "Resting" : "Ready") + '</span>' +
      '<em>' + esc(timer.label || "no set logged yet") + '</em></div></div>' +
      '<div class="presets">' + REST_OPTS.map(function(sec){
        return '<button data-act="preset" data-s="' + sec + '" aria-pressed="' + (timer.duration === sec) + '" class="num">' +
          (sec < 120 ? sec + "s" : sec/60 + "m") + '</button>';
      }).join("") + '</div>' +
      '<div class="tcontrols"><button class="go" data-act="toggle-timer">' + (timer.running ? "Pause" : timer.remaining === 0 ? "Restart" : "Start") + '</button>' +
      '<button class="alt num" data-act="add30">+30s</button><button class="rst" data-act="reset-timer">Reset</button></div></div>';
  }
  function pickerSheet(){
    return '<div class="scrim" data-act="close-overlay"></div><div class="sheet tall">' +
      '<div style="padding-bottom:12px;border-bottom:1.5px solid var(--line)"><div class="grab"></div>' +
      '<div class="sheethead"><div style="font-size:18px;font-weight:600">Add exercise</div><button data-act="close-overlay">Close</button></div></div>' +
      '<div style="flex:1;overflow-y:auto;padding:14px 0 calc(28px + env(safe-area-inset-bottom))">' +
      '<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>' +
      '<input id="pickSearch" placeholder="Search or type a new exercise" value="' + esc(librarySearch) + '" /></div>' +
      libraryList(false) + '</div></div>';
  }
  function detailScreen(){
    var w = workouts.filter(function(x){ return x.id === detailId; })[0];
    if(!w) return "";
    return '<div class="screen"><div class="hd"><div class="inner">' +
      '<button class="back" data-act="close-detail"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B6C5CB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>History</button>' +
      '<div class="titlerow"><h2>' + esc(w.name || titleFor(sessionTag(w.exercises))) + '</h2>' +
      '<button class="renamebtn" data-act="rename-workout" data-id="' + w.id + '">Rename</button></div>' +
      '<div class="tagline mono" style="margin-top:4px">' + esc(fmtDate(w.date)) + '</div><div class="dstats">' +
      '<div><b class="num">' + volFmt(tVol(w.exercises)) + '</b><small>Volume</small></div>' +
      '<div><b class="num">' + tSets(w.exercises) + '</b><small>Sets</small></div>' +
      '<div><b class="num">' + (w.minutes ? w.minutes + "m" : "—") + '</b><small>Time</small></div></div></div></div>' +
      '<div class="body"><div class="inner">' +
      w.exercises.map(function(e){
        var best = Math.max.apply(null, e.sets.map(function(s){ return s.weight; }));
        return '<div class="soft" style="margin-bottom:12px;overflow:hidden">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-bottom:1.5px solid var(--line)">' +
          '<b style="font-size:14.5px;font-family:\'Unbounded\',sans-serif;text-transform:uppercase">' + esc(e.name) + '</b><span class="num" style="font-size:10.5px;color:var(--ink-soft)">vol ' +
          volFmt(e.sets.reduce(function(a,s){ return a + s.weight*s.reps; }, 0)) + '</span></div>' +
          e.sets.map(function(s,i){
            return '<div class="dset num"><span class="i">' + (i+1) + '</span><b>' + (s.weight || "BW") + (s.weight ? " " + settings.unit : "") +
              '</b><b>' + s.reps + ' reps</b><b style="color:var(--ink-soft);font-weight:600">' + (s.rpe ? "RPE " + s.rpe : "—") + '</b>' +
              '<span class="top">' + (s.weight === best && s.weight ? "TOP SET" : "") + '</span></div>';
          }).join("") + '</div>';
      }).join("") +
      (w.notes ? '<div class="notes">' + esc(w.notes) + '</div>' : "") +
      '<div class="finishrow"><button class="primary" style="flex:1" data-act="repeat" data-id="' + w.id + '">Repeat this workout</button>' +
      '<button class="discard" data-act="del-workout" data-id="' + w.id + '">Delete</button></div></div></div></div>';
  }
  function settingsScreen(){
    return '<div class="screen"><div class="hd"><div class="inner" style="display:flex;align-items:center;justify-content:space-between">' +
      '<div style="font-size:22px;font-weight:700;color:var(--head-ink);letter-spacing:.02em">Settings</div>' +
      '<button class="back" data-act="close-overlay">Done</button></div></div><div class="body"><div class="inner">' +
      '<div class="sect"><div class="eyebrow" style="margin-bottom:9px">Units</div><div class="seg">' +
      ["lb","kg"].map(function(u){ return '<button data-act="unit" data-u="' + u + '" aria-pressed="' + (settings.unit === u) + '">' + u.toUpperCase() + '</button>'; }).join("") +
      '</div></div>' +
      '<div class="sect"><div class="eyebrow" style="margin-bottom:9px">Default rest</div><div class="restopts">' +
      REST_OPTS.map(function(sec){ return '<button class="num" data-act="def-rest" data-s="' + sec + '" aria-pressed="' + (settings.defaultRest === sec) + '">' +
        (sec < 120 ? sec + "s" : sec/60 + "m") + '</button>'; }).join("") + '</div></div>' +
      '<div class="sect"><div class="eyebrow" style="margin-bottom:9px">Behaviour</div><div class="soft" style="overflow:hidden">' +
      [["darkMode","Dark mode","Low-light palette for the gym floor"],
       ["autoTimer","Auto-start rest timer","Starts when you check off a set"],
       ["sound","Sound + vibrate on finish","Three beeps, short buzz"]].map(function(t){
        return '<button class="togglerow" data-act="flip" data-k="' + t[0] + '" aria-pressed="' + !!settings[t[0]] + '">' +
          '<span><b>' + t[1] + '</b><small>' + t[2] + '</small></span><span class="track"><i></i></span></button>';
      }).join("") + '</div></div>' +
      '<div class="sect"><div class="eyebrow" style="margin-bottom:9px">Readiness</div><div class="soft" style="padding:14px">' +
      '<a href="readiness.html" style="display:block;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none">Open readiness dashboard &rarr;</a>' +
      '<div style="font-size:11px;color:var(--ink-soft);margin-top:4px">HRV, recovery score, and trends, passphrase required</div></div></div>' +
      '<div class="sect"><div class="eyebrow" style="margin-bottom:9px">Data</div><div class="soft" style="padding:14px">' +
      '<div style="font-size:13.5px;color:var(--ink-soft);line-height:1.5">Stored on this device only, in this browser or installed app. Export a JSON backup before clearing site data.</div>' +
      '<div class="datarow"><button class="exp" data-act="export">Export JSON</button><button class="clr" data-act="clear">Clear all</button></div></div></div>' +
      '</div></div></div>';
  }

  // ---------- render ----------
  function render(){
    el("tagline").textContent = active ? "session in progress" : "date · exercise · load · reps";
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
      b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    });
    ["today","history","progress","library"].forEach(function(t){ el("view-" + t).classList.toggle("hidden", t !== tab); });
    if(tab === "today") el("view-today").innerHTML = viewToday();
    if(tab === "history") el("view-history").innerHTML = viewHistory();
    if(tab === "progress") el("view-progress").innerHTML = viewProgress();
    if(tab === "library") el("view-library").innerHTML = viewLibrary();

    var bar = el("timerBar");
    el("barTime").textContent = mmss(timer.remaining);
    el("barLabel").textContent = timer.running ? "Rest timer · running" : "Rest timer";
    el("barGo").textContent = timer.running ? "Pause" : timer.remaining === 0 ? "Restart" : "Start";
    bar.classList.toggle("running", timer.running);
    bar.classList.toggle("rang", timer.remaining === 0);

    el("overlays").innerHTML = overlay === "timer" ? timerSheet()
      : overlay === "picker" ? pickerSheet()
      : overlay === "settings" ? settingsScreen()
      : detailId ? detailScreen() : "";
    document.body.style.overflow = (overlay || detailId) ? "hidden" : "";
  }
  function tickTimerUI(){
    if(el("barTime")) el("barTime").textContent = mmss(timer.remaining);
    var st = el("sheetTime"); if(st) st.textContent = mmss(timer.remaining);
    var g = el("gauge");
    if(g){ var frac = timer.duration ? timer.remaining/timer.duration : 0;
      g.setAttribute("stroke-dashoffset", GC*(1-frac));
      g.setAttribute("stroke", timer.remaining === 0 ? "var(--amber)" : "var(--ink)"); }
    var ss = el("sheetStatus"); if(ss) ss.textContent = timer.remaining === 0 ? "Time — next set" : timer.running ? "Resting" : "Ready";
    if(el("elapsed") && active) el("elapsed").textContent = mmss(Math.floor((Date.now() - active.startedAt)/1000));
  }

  // ---------- timer ----------
  function setPreset(sec){ timer.duration = sec; timer.remaining = sec; timer.running = false; render(); }
  function toggleTimer(){
    if(timer.running){ timer.running = false; render(); return; }
    if(timer.remaining === 0) timer.remaining = timer.duration;
    timer.running = true; render();
  }
  function beep(){
    if(!settings.sound) return;
    try{
      timer.ctx = timer.ctx || new (window.AudioContext || window.webkitAudioContext)();
      var now = timer.ctx.currentTime;
      [0,0.18,0.36].forEach(function(off){
        var osc = timer.ctx.createOscillator(), g = timer.ctx.createGain();
        osc.type = "sine"; osc.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, now+off);
        g.gain.exponentialRampToValueAtTime(0.25, now+off+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now+off+0.15);
        osc.connect(g).connect(timer.ctx.destination); osc.start(now+off); osc.stop(now+off+0.16);
      });
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }
  setInterval(function(){
    if(timer.running){
      timer.remaining = Math.max(0, timer.remaining - 1);
      if(timer.remaining === 0){ timer.running = false; beep(); render(); return; }
    }
    tickTimerUI();
  }, 1000);

  // ---------- events ----------
  document.addEventListener("click", function(ev){
    var t = ev.target.closest("[data-act], #tabs button, #settingsBtn, #timerBar");
    if(!t) return;
    if(t.id === "settingsBtn"){ overlay = "settings"; return render(); }
    if(t.id === "themeBtn"){ settings.darkMode = !settings.darkMode; saveSettings(); applyTheme(); return; }
    if(t.id === "timerBar"){
      if(ev.target.closest("#barGo")) return toggleTimer();
      overlay = "timer"; return render();
    }
    if(t.parentElement && t.parentElement.id === "tabs"){ tab = t.dataset.tab; detailId = null; return render(); }

    var a = t.dataset.act, ei = Number(t.dataset.e), si = Number(t.dataset.s);
    if(a === "start-empty") return startSession([]);
    if(a === "start-tmpl") return startSession(TEMPLATES[Number(t.dataset.i)].items);
    if(a === "start-routine"){ tab = "today"; return startSession(TEMPLATES[Number(t.dataset.i)].items); }
    if(a === "goto-routines"){ tab = "history"; return render(); }
    if(a === "open-picker"){ librarySearch = ""; overlay = "picker"; return render(); }
    if(a === "close-overlay"){ overlay = null; return render(); }
    if(a === "close-detail"){ detailId = null; return render(); }
    if(a === "open-detail"){ detailId = t.dataset.id; return render(); }
    if(a === "add-ex") return addExercise(t.dataset.name);
    if(a === "add-typed") return addExercise(librarySearch);
    if(a === "rm-ex"){ active.exercises.splice(ei,1); saveActive(); return render(); }
    if(a === "add-set"){ var l = active.exercises[ei].sets.slice(-1)[0];
      active.exercises[ei].sets.push({ weight: l ? l.weight : 0, reps: l ? l.reps : 8, rpe:0, done:false }); saveActive(); return render(); }
    if(a === "w+" || a === "w-" || a === "r+" || a === "r-" || a === "rpe+" || a === "rpe-"){
      var st = active.exercises[ei].sets[si];
      if(a === "w+") st.weight = Number(st.weight) + 5;
      if(a === "w-") st.weight = Math.max(0, Number(st.weight) - 5);
      if(a === "r+") st.reps = Number(st.reps) + 1;
      if(a === "r-") st.reps = Math.max(0, Number(st.reps) - 1);
      if(a === "rpe+") st.rpe = Math.min(10, Number(st.rpe||0) + 1);
      if(a === "rpe-") st.rpe = Math.max(0, Number(st.rpe||0) - 1);
      saveActive(); return render();
    }
    if(a === "chk"){
      var s2 = active.exercises[ei].sets[si], wasDone = s2.done;
      s2.done = !wasDone; saveActive();
      if(!wasDone && settings.autoTimer){
        timer.duration = settings.defaultRest; timer.remaining = settings.defaultRest; timer.running = true;
        timer.label = active.exercises[ei].name + " · set " + (si+1); overlay = "timer";
      }
      return render();
    }
    if(a === "finish") return finishSession();
    if(a === "discard"){ if(confirm("Discard this session?")){ active = null; saveActive(); timer.running = false; render(); } return; }
    if(a === "repeat"){ var w = workouts.filter(function(x){ return x.id === t.dataset.id; })[0];
      detailId = null; return startSession(w.exercises.map(function(e){ return e.name; })); }
    if(a === "del-workout"){ if(confirm("Delete this session?")){
      workouts = workouts.filter(function(x){ return x.id !== t.dataset.id; }); saveWorkouts(); detailId = null; render(); } return; }
    if(a === "rename-workout"){
      var wk = workouts.filter(function(x){ return x.id === t.dataset.id; })[0]; if(!wk) return;
      var nm = prompt("Rename this workout", wk.name || titleFor(sessionTag(wk.exercises)));
      if(nm !== null && nm.trim()){ wk.name = nm.trim(); saveWorkouts(); render(); } return;
    }
    if(a === "preset") return setPreset(Number(t.dataset.s));
    if(a === "toggle-timer") return toggleTimer();
    if(a === "add30"){ timer.remaining += 30; timer.duration = Math.max(timer.duration, timer.remaining); return render(); }
    if(a === "reset-timer"){ timer.running = false; timer.remaining = timer.duration; return render(); }
    if(a === "unit"){ settings.unit = t.dataset.u; saveSettings(); return render(); }
    if(a === "def-rest"){ settings.defaultRest = Number(t.dataset.s); saveSettings();
      if(!timer.running){ timer.duration = timer.remaining = settings.defaultRest; } return render(); }
    if(a === "flip"){ var k = t.dataset.k; settings[k] = !settings[k]; saveSettings(); if(k === "darkMode") applyTheme(); return render(); }
    if(a === "export"){
      var blob = new Blob([JSON.stringify({ workouts:workouts, customExercises:customExercises, settings:settings }, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob), link = document.createElement("a");
      link.href = url; link.download = "setlog-backup-" + todayStr() + ".json"; link.click();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000); return;
    }
    if(a === "clear"){ if(confirm("Delete every logged session on this device?")){
      workouts = []; customExercises = []; active = null; saveWorkouts();
      write("setlog_customExercises", []); saveActive(); render(); } return; }
  });

  document.addEventListener("input", function(ev){
    var t = ev.target;
    if(t.id === "notes" && active){ active.notes = t.value; saveActive(); return; }
    if(t.id === "libSearch"){ librarySearch = t.value;
      var host = el("view-library"); var pos = t.selectionStart;
      host.innerHTML = viewLibrary(); var again = el("libSearch");
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} } return; }
    if(t.id === "pickSearch"){ librarySearch = t.value;
      var pos2 = t.selectionStart; el("overlays").innerHTML = pickerSheet();
      var p = el("pickSearch"); if(p){ p.focus(); try{ p.setSelectionRange(pos2,pos2); }catch(e){} } return; }
    if(t.id === "routineSearch"){ routineSearch = t.value;
      var q = routineSearch.trim().toLowerCase();
      var matched = !q ? TEMPLATES : TEMPLATES.filter(function(tm){
        return tm.name.toLowerCase().indexOf(q) > -1 || tm.items.join(" ").toLowerCase().indexOf(q) > -1;
      });
      var rhost = el("routinesSection"); var rpos = t.selectionStart;
      if(rhost){ rhost.innerHTML = routinesListHtml(matched);
        var again2 = el("routineSearch"); if(again2){ again2.focus(); try{ again2.setSelectionRange(rpos,rpos); }catch(e){} } }
      return;
    }
    if(t.dataset && (t.dataset.act === "w=" || t.dataset.act === "r=" || t.dataset.act === "rpe=") && active){
      var set = active.exercises[Number(t.dataset.e)].sets[Number(t.dataset.s)];
      if(t.dataset.act === "w=") set.weight = t.value === "" ? 0 : Number(t.value);
      else if(t.dataset.act === "rpe=") set.rpe = t.value === "" ? 0 : Math.max(0, Math.min(10, Number(t.value)));
      else set.reps = t.value === "" ? 0 : Number(t.value);
      saveActive();
    }
  });

  load();
  render();
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
